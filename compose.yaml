services:
  app:
    build: .
    restart: unless-stopped
    mem_limit: 1g
    stop_grace_period: 30s
    environment:
      TZ: ${APP_TIMEZONE:-Europe/Istanbul}
      DB_URL: jdbc:postgresql://postgres:5432/radioparadise
      DB_USERNAME: ${DB_USERNAME:-radioparadise}
      DB_PASSWORD: ${DB_PASSWORD:-radioparadise}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    # Host loopback only; remote clients connect through an SSH tunnel.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: radioparadise
      POSTGRES_USER: ${DB_USERNAME:-radioparadise}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-radioparadise}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
