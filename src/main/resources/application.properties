# Server Configuration
server.port=8081
# Caddy supplies X-Forwarded-For/Proto; Tomcat applies its internal-proxy trust rules.
# Keep the backend private. Direct deployments can disable this with NONE.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:NATIVE}

# Internal monitoring only (Caddy blocks /actuator from public traffic)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# Route templates supply bounded URI tags; do not add song/user/request-id tags.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.distribution.slo.http.server.requests=100ms,300ms,1s,3s
management.metrics.web.server.max-uri-tags=100
# RP calls use a URI template so channel/query values cannot create unbounded series.
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.minimum-expected-value.http.client.requests=5ms
management.metrics.distribution.maximum-expected-value.http.client.requests=20s
management.metrics.distribution.slo.http.client.requests=100ms,300ms,1s,3s,5s,15s
management.metrics.distribution.slo.radioparadise.collector.poll.duration=100ms,500ms,1s,5s,15s,30s

# PostgreSQL Database Configuration (defaults match compose.yaml for local development)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/radioparadise}
spring.datasource.username=${DB_USERNAME:radioparadise}
spring.datasource.password=${DB_PASSWORD:radioparadise}
# Hikari pool utilization/timing and JVM/process metrics are auto-bound by Actuator.
spring.datasource.hikari.pool-name=RadioParadisePool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Application Configuration
radioparadise.api.base-url=https://api.radioparadise.com
radioparadise.api.channels=0,1,2
radioparadise.scheduler.fixed-delay=30000

# On-demand recording/ISRC enrichment; no account credentials required.
musicbrainz.api.base-url=${MUSICBRAINZ_API_BASE_URL:https://musicbrainz.org}

# Logging
logging.level.com.radioparadise.tracker=INFO
# Keep the timestamp/severity prefix compatible with the Alloy multiline/level parser.
logging.pattern.level=%5p traceId=%X{traceId:-} requestId=%X{requestId:-} clientIp="%X{clientIp:-}" httpMethod="%X{httpMethod:-}" requestPath="%X{requestPath:-}" userAgent="%X{userAgent:-}" httpStatus=%X{httpStatus:-} durationMs=%X{durationMs:-}
