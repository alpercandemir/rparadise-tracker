name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Commit SHA to deploy (or use the Rollback button with an older SHA)
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  queue: max

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate deployment commit
        env:
          IMAGE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_sha }}
        run: |
          if [[ ! "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The deployment commit must be a full 40-character lowercase commit SHA.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$IMAGE_SHA" origin/main; then
            echo 'The deployment commit must belong to the main branch history.' >&2
            exit 1
          fi
          git checkout --detach "$IMAGE_SHA"
      - name: Install SSH credentials
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '138.2.168.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGqx2YJFhibyRhBYVvaAf8FRFSSCWFK6eowGC4jUgiXU' > ~/.ssh/known_hosts
      - name: Copy production runtime configuration
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ubuntu@138.2.168.194 'mkdir -p /home/ubuntu/rparadise-tracker/scripts/systemd'
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes compose.production.yaml compose.recording-backfill.yaml ubuntu@138.2.168.194:/home/ubuntu/rparadise-tracker/
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes scripts/run-recording-backfill.sh ubuntu@138.2.168.194:/home/ubuntu/rparadise-tracker/scripts/run-recording-backfill.sh.next
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes scripts/install-recording-retry.sh ubuntu@138.2.168.194:/home/ubuntu/rparadise-tracker/scripts/install-recording-retry.sh.next
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ubuntu@138.2.168.194 \
            'cd /home/ubuntu/rparadise-tracker/scripts && mv run-recording-backfill.sh.next run-recording-backfill.sh && mv install-recording-retry.sh.next install-recording-retry.sh'
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes scripts/systemd/rparadise-recording-retry.service scripts/systemd/rparadise-recording-retry.timer ubuntu@138.2.168.194:/home/ubuntu/rparadise-tracker/scripts/systemd/
      - name: Deploy image
        env:
          IMAGE: ghcr.io/alpercandemir/rparadise-tracker:sha-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.image_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ubuntu@138.2.168.194 \
            "cd /home/ubuntu/rparadise-tracker && APP_IMAGE='$IMAGE' sudo --preserve-env=APP_IMAGE docker compose -f compose.yaml -f compose.observability.yaml -f compose.production.yaml pull app && APP_IMAGE='$IMAGE' sudo --preserve-env=APP_IMAGE docker compose -f compose.yaml -f compose.observability.yaml -f compose.production.yaml up -d --no-build --wait --wait-timeout 300 app"
          curl --fail --silent --show-error \
            --resolve rparadise.138.2.168.194.sslip.io:443:138.2.168.194 \
            https://rparadise.138.2.168.194.sslip.io/api/songs
      - name: Update daily recording retry worker
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ubuntu@138.2.168.194 \
            'cd /home/ubuntu/rparadise-tracker && bash scripts/install-recording-retry.sh'
