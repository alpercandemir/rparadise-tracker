global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    deployment: radioparadise
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [app:8081]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: node
    static_configs:
      - targets: [host.docker.internal:9100]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://rparadise.138.2.168.194.sslip.io/
          - https://rparadise.138.2.168.194.sslip.io/api/songs/recent
          - https://rparadise.138.2.168.194.sslip.io/grafana/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
