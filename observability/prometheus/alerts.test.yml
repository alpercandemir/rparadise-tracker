rule_files: [alerts.yml]
evaluation_interval: 30s
tests:
  - name: collector startup grace avoids false alerts
    interval: 30s
    input_series:
      - series: 'radioparadise_collector_last_success_timestamp_seconds{job="app",instance="app:8081",channel="0"}'
        values: '0+0x20'
      - series: 'process_uptime_seconds{job="app",instance="app:8081"}'
        values: '0+30x20'
    alert_rule_test:
      - eval_time: 2m
        alertname: CollectorStalled
        exp_alerts: []
      - eval_time: 6m
        alertname: CollectorStalled
        exp_alerts:
          - exp_labels: {job: app, instance: 'app:8081', channel: '0', severity: critical}
            exp_annotations:
              summary: Collector has stopped succeeding for channel 0
              description: No successful poll for over 3 minutes after startup; condition persisted 2 minutes. Check upstream API errors and collector logs.
  - name: successful polls stay fresh even if song never changes
    interval: 30s
    input_series:
      - series: 'radioparadise_collector_last_success_timestamp_seconds{job="app",instance="app:8081",channel="0"}'
        values: '0+30x40'
      - series: 'process_uptime_seconds{job="app",instance="app:8081"}'
        values: '0+30x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: CollectorStalled
        exp_alerts: []
  - name: low request volume suppresses HTTP ratio noise
    interval: 30s
    input_series:
      - series: 'http_server_requests_seconds_count{job="app",instance="app:8081",uri="/api/songs/recent",status="500"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: HttpServerErrors
        exp_alerts: []
  - name: sustained HTTP errors at meaningful volume fire
    interval: 30s
    input_series:
      - series: 'http_server_requests_seconds_count{job="app",instance="app:8081",uri="/api/songs/recent",status="500"}'
        values: '0+5x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: HttpServerErrors
        exp_alerts:
          - exp_labels: {job: app, instance: 'app:8081', severity: critical}
            exp_annotations:
              summary: Application 5xx response ratio above 5 percent
              description: At least 20 user requests in 5 minutes; health and metric probes excluded. Inspect app and Caddy logs.
