# Panel-only until a real SMTP credential is installed and the Gmail template is activated.
global:
  resolve_timeout: 5m
route:
  receiver: panel-only
  group_by: [alertname, job, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: panel-only
inhibit_rules:
  - source_matchers: ['alertname="TargetDown"']
    target_matchers: ['alertname=~"PostgresDown|CollectorStalled|HttpHighLatency|HttpServerErrors"']
    equal: [job, instance]
