# Use with: docker compose -f compose.yaml -f compose.observability.yaml up -d
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: com.docker.compose.service,com.docker.compose.project
x-observer: &observer
  restart: unless-stopped
  logging: *logs
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  app:
    logging: *logs
    cpus: 1.00
  postgres:
    logging: *logs
    mem_limit: 768m
    cpus: 1.00
    command: [postgres, -c, log_min_duration_statement=500, -c, log_lock_waits=on, -c, log_checkpoints=on, -c, shared_preload_libraries=pg_stat_statements]
  caddy:
    logging: *logs
    mem_limit: 128m
    cpus: 0.30
  prometheus:
    <<: *observer
    image: prom/prometheus:v3.13.5
    mem_limit: 448m
    cpus: 0.60
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --query.max-concurrency=4
      - --query.max-samples=5000000
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts: [host.docker.internal:host-gateway]
  grafana:
    <<: *observer
    image: grafana/grafana:13.3.0
    mem_limit: 768m
    cpus: 0.50
    ports: [127.0.0.1:3001:3000]
    environment:
      GOMEMLIMIT: 512MiB
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:8080/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/radioparadise.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
  loki:
    <<: *observer
    image: grafana/loki:3.7.9
    mem_limit: 512m
    cpus: 0.60
    command: [-config.file=/etc/loki/config.yml]
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
  alloy:
    <<: *observer
    image: grafana/alloy:v1.21.3
    user: "0:0"
    mem_limit: 160m
    cpus: 0.30
    environment:
      GOMEMLIMIT: 120MiB
    command: [run, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-data:/var/lib/alloy
  node-exporter:
    <<: *observer
    image: prom/node-exporter:v1.10.2
    mem_limit: 64m
    cpus: 0.15
    pid: host
    # Host net namespace is required for real enp0s6 counters, rather than container eth0.
    network_mode: host
    command:
      # Listen only on Docker's private host gateway, never the VM's public interface.
      - --web.listen-address=${NODE_EXPORTER_LISTEN_ADDRESS:-172.17.0.1:9100}
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/credentials/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
  postgres-exporter:
    <<: *observer
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    mem_limit: 80m
    cpus: 0.20
    environment:
      DATA_SOURCE_URI: postgres:5432/radioparadise?sslmode=disable
      DATA_SOURCE_USER: postgres_exporter
      DATA_SOURCE_PASS: ${PG_EXPORTER_PASSWORD:?Set PG_EXPORTER_PASSWORD}
    command:
      - --collector.stat_statements
    depends_on:
      postgres:
        condition: service_healthy
  blackbox-exporter:
    <<: *observer
    image: prom/blackbox-exporter:v0.29.1
    mem_limit: 48m
    cpus: 0.15
    command: [--config.file=/etc/blackbox/config.yml]
    volumes:
      - ./observability/blackbox/config.yml:/etc/blackbox/config.yml:ro
  alertmanager:
    <<: *observer
    image: prom/alertmanager:v0.34.2
    mem_limit: 64m
    cpus: 0.15
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager, --cluster.listen-address=]
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./.secrets/smtp_password:/etc/alertmanager/secrets/smtp_password:ro
      - alertmanager-data:/alertmanager
volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  alertmanager-data:
